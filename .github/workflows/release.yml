name: Sync neterm releases

# Manual release sync for the public neterm release repository.
#
# Builds missing `release/neterm/*` tags from the private source repository and
# the latest `main` branch (published as `nightly`). Build steps mirror
# chengwei920412/topic_sketch/.github/workflows/neterm-build.yml.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of missing release tags to build (0 = all)
        required: true
        default: '3'
      force:
        description: Rebuild tags that already exist in this repository
        type: boolean
        default: false
      latest:
        description: Also build the newest release tag, even if it already exists
        type: boolean
        default: false
      tag:
        description: Build only this release tag (e.g. release/neterm/v0.8.1)
        required: false
        default: ''
      include_nightly:
        description: Build the latest topic_sketch main as nightly
        type: boolean
        default: true
      draft:
        description: Keep newly created releases as drafts
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-neterm-releases
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: chengwei920412/topic_sketch
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NETERM_CARGO_TIMINGS: '1'
  RUST_VERSION: 1.95.0

jobs:
  prepare:
    name: Prepare refs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      stable_matrix: ${{ steps.matrix.outputs.stable_matrix }}
      stable_count: ${{ steps.matrix.outputs.stable_count }}
      include_nightly: ${{ steps.matrix.outputs.include_nightly }}
    steps:
      - name: List topic_sketch release tags
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${SOURCE_REPOSITORY}/git/matching-refs/tags/release/neterm/" \
            --jq '.[].ref' \
            | sed 's#^refs/tags/##' \
            | sort -u > "$RUNNER_TEMP/source-tags.txt"
          cat "$RUNNER_TEMP/source-tags.txt"

      - name: List existing release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/release/neterm/" \
            --jq '.[].ref' \
            | sed 's#^refs/tags/##' \
            | sort -u > "$RUNNER_TEMP/target-tags.txt"
          cat "$RUNNER_TEMP/target-tags.txt"

      - name: Compute build matrix
        id: matrix
        env:
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          LATEST: ${{ inputs.latest }}
          TAG: ${{ inputs.tag }}
          INCLUDE_NIGHTLY: ${{ inputs.include_nightly }}
        run: |
          set -euo pipefail
          if [[ ! "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "limit must be a non-negative integer, got: $LIMIT" >&2
            exit 1
          fi

          if [[ -n "$TAG" ]]; then
            if [[ ! "$TAG" =~ ^release/neterm/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tag must look like release/neterm/vX.Y.Z, got: $TAG" >&2
              exit 1
            fi
            if ! grep -Fxq "$TAG" "$RUNNER_TEMP/source-tags.txt"; then
              echo "tag $TAG does not exist in $SOURCE_REPOSITORY" >&2
              exit 1
            fi
            selected="$TAG"
          else
            if [[ "$FORCE" == "true" ]]; then
              missing="$(cat "$RUNNER_TEMP/source-tags.txt")"
            else
              missing="$(comm -23 "$RUNNER_TEMP/source-tags.txt" "$RUNNER_TEMP/target-tags.txt")"
            fi

            # Oldest first so repeated runs fill the backlog from the front.
            missing="$(printf '%s\n' "$missing" | sed '/^$/d' | sort -V)"
            if [[ "$LIMIT" != "0" ]]; then
              missing="$(printf '%s\n' "$missing" | head -n "$LIMIT")"
            fi

            selected="$missing"
            if [[ "$LATEST" == "true" ]]; then
              latest_tag="$(sed '/^$/d' "$RUNNER_TEMP/source-tags.txt" | sort -V | tail -n 1)"
              if [[ -n "$latest_tag" ]]; then
                selected="$(printf '%s\n%s\n' "$selected" "$latest_tag")"
              fi
            fi

            selected="$(printf '%s\n' "$selected" | sed '/^$/d' | sort -V -u)"
          fi

          entries="[]"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            slug="${tag//\//-}"
            entries="$(jq -c --arg ref "$tag" --arg tag "$tag" --arg slug "$slug" \
              '. + [{ref: $ref, tag: $tag, slug: $slug, nightly: false}]' <<<"$entries")"
          done <<<"$selected"

          if [[ "$INCLUDE_NIGHTLY" == "true" ]]; then
            entries="$(jq -c \
              '. + [{ref: "main", tag: "nightly", slug: "nightly", nightly: true}]' \
              <<<"$entries")"
          fi

          count="$(jq 'length' <<<"$entries")"
          stable_entries="$(jq -c '[.[] | select(.nightly == false)]' <<<"$entries")"
          stable_count="$(jq 'length' <<<"$stable_entries")"
          printf '{"include":%s}\n' "$entries" > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "stable_matrix={\"include\":$stable_entries}" >> "$GITHUB_OUTPUT"
          echo "stable_count=$stable_count" >> "$GITHUB_OUTPUT"
          echo "include_nightly=$INCLUDE_NIGHTLY" >> "$GITHUB_OUTPUT"

          {
            echo "### neterm release sync"
            echo ""
            echo "| ref | release tag | nightly |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| `\(.ref)` | `\(.tag)` | \(.nightly) |"' <<<"$entries"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-x86-64:
    name: Linux x86-64 (${{ matrix.tag }})
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ubuntu:22.04
    env:
      # rv-session enables openssl/vendored; use the distro libssl instead of
      # compiling OpenSSL from source.
      OPENSSL_NO_VENDOR: '1'
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: applets/neterm
    steps:
      - name: Install container tools and Linux build dependencies
        working-directory: /
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            git \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            zstd
          rm -rf /var/lib/apt/lists/*

      - name: Check out topic_sketch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: applets/neterm
          fetch-depth: 1

      - name: Drop git index before build
        # Cargo 1.95 uses gitoxide to enumerate package files. In the Linux
        # container its excludes stack can fail on the Actions workspace. An
        # empty index makes Cargo fall back to its plain directory walk.
        run: rm -f "$GITHUB_WORKSPACE/.git/index"

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
            https://sh.rustup.rs \
            | sh -s -- --yes --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add x86_64-unknown-linux-gnu

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ matrix.slug }}-${{ hashFiles('applets/neterm/Cargo.lock') }}
          restore-keys: |
            cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ matrix.slug }}-
            cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Build Debian package
        run: ./scripts/build_x86_64_linux.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: neterm-linux-${{ matrix.slug }}
          path: applets/neterm/dist/neterm_*_linux_amd64.deb
          if-no-files-found: error
          retention-days: 1

  macos-arm64:
    name: macOS arm64 (${{ matrix.tag }})
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      OPENSSL_NO_VENDOR: '1'
      OPENSSL_STATIC: '1'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: applets/neterm
    steps:
      - name: Check out topic_sketch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: applets/neterm
          fetch-depth: 1

      - name: Drop git index before build
        # Cargo 1.95 uses gitoxide to enumerate package files. In the Linux
        # container its excludes stack can fail on the Actions workspace. An
        # empty index makes Cargo fall back to its plain directory walk.
        run: rm -f "$GITHUB_WORKSPACE/.git/index"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-darwin

      - name: Locate prebuilt OpenSSL
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ matrix.slug }}-${{ hashFiles('applets/neterm/Cargo.lock') }}
          restore-keys: |
            cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ matrix.slug }}-
            cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Build macOS DMG
        run: ./scripts/build_arm64_mac.sh

      - name: Verify macOS package
        run: |
          shopt -s nullglob
          dmg_files=(dist/neterm_*_macos_aarch64.dmg)
          other_archives=(dist/neterm_*_macos_aarch64.zip dist/neterm_*_macos_aarch64.tar.gz)
          if (( ${#dmg_files[@]} != 1 || ${#other_archives[@]} != 0 )); then
            echo "Expected exactly one macOS DMG and no ZIP or tar.gz packages." >&2
            exit 1
          fi
          hdiutil imageinfo "${dmg_files[0]}" >/dev/null

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: neterm-macos-${{ matrix.slug }}
          path: applets/neterm/dist/neterm_*_macos_aarch64.dmg
          if-no-files-found: error
          retention-days: 1

  windows-x86-64:
    name: Windows x86-64 (${{ matrix.tag }})
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      OPENSSL_NO_VENDOR: '1'
      OPENSSL_STATIC: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-bincache
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: applets/neterm
    steps:
      - name: Check out topic_sketch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: applets/neterm
          fetch-depth: 1

      - name: Drop git index before build
        # Cargo 1.95 uses gitoxide to enumerate package files. In the Linux
        # container its excludes stack can fail on the Actions workspace. An
        # empty index makes Cargo fall back to its plain directory walk.
        run: rm -f "$GITHUB_WORKSPACE/.git/index"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add x86_64-pc-windows-msvc

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-bincache
          key: vcpkg-openssl-x64-windows-static-md-v1

      - name: Install prebuilt OpenSSL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg failed to install OpenSSL.' }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ matrix.slug }}-${{ hashFiles('applets/neterm/Cargo.lock') }}
          restore-keys: |
            cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ matrix.slug }}-
            cargo-sources-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Build Windows application
        run: ./scripts/build_x86_64_msvc.sh

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: neterm-windows-${{ matrix.slug }}
          path: applets/neterm/dist/neterm_*_windows_x86_64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish (${{ matrix.tag }})
    needs:
      - prepare
      - linux-x86-64
      - macos-arm64
      - windows-x86-64
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.stable_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.stable_matrix) }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: neterm-*-${{ matrix.slug }}
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          TAG: ${{ matrix.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          debs=(release-assets/neterm_*_linux_amd64.deb)
          dmgs=(release-assets/neterm_*_macos_aarch64.dmg)
          zips=(release-assets/neterm_*_windows_x86_64.zip)
          if (( ${#debs[@]} != 1 || ${#dmgs[@]} != 1 || ${#zips[@]} != 1 )); then
            echo "::warning::Incomplete artifacts for ${TAG} (deb=${#debs[@]} dmg=${#dmgs[@]} zip=${#zips[@]}); skipping."
            exit 0
          fi
          assets=("${debs[0]}" "${dmgs[0]}" "${zips[0]}")

          notes_file="$(mktemp)"
          source_ref="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
            "repos/${SOURCE_REPOSITORY}/git/ref/tags/${TAG}")"
          source_type="$(jq -r '.object.type' <<<"$source_ref")"
          if [[ "$source_type" == "tag" ]]; then
            source_sha="$(jq -r '.object.sha' <<<"$source_ref")"
            source_tag="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
              "repos/${SOURCE_REPOSITORY}/git/tags/${source_sha}")"
            jq -e -r '.message | select(type == "string" and test("\\S"))' \
              <<<"$source_tag" > "$notes_file" || {
                echo "Annotated source tag $TAG has no release message." >&2
                exit 1
              }
          elif [[ "$source_type" == "commit" ]]; then
            printf 'neterm %s\n' "${TAG##*/}" > "$notes_file"
          else
            echo "Source tag $TAG has unexpected object type: $source_type" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "neterm ${TAG##*/}" \
              --notes-file "$notes_file" \
              --draft
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi

          if [[ "$DRAFT" != "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  publish-nightly:
    name: Publish nightly last
    needs:
      - prepare
      - publish
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.include_nightly == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download nightly build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: neterm-*-nightly
          path: release-assets
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          debs=(release-assets/neterm_*_linux_amd64.deb)
          dmgs=(release-assets/neterm_*_macos_aarch64.dmg)
          zips=(release-assets/neterm_*_windows_x86_64.zip)
          if (( ${#debs[@]} != 1 || ${#dmgs[@]} != 1 || ${#zips[@]} != 1 )); then
            echo "::warning::Incomplete artifacts for nightly (deb=${#debs[@]} dmg=${#dmgs[@]} zip=${#zips[@]}); skipping."
            exit 0
          fi
          assets=("${debs[0]}" "${dmgs[0]}" "${zips[0]}")

          notes_file="$(mktemp)"
          printf 'neterm nightly build from `main`\n' > "$notes_file"
          # Recreate nightly after stable releases so it appears first on the
          # Releases page while keeping the nightly download URLs stable.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "neterm nightly" \
            --notes-file "$notes_file" \
            --prerelease \
            --draft
          gh release upload nightly "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --draft=false
